# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build TOKI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish Windows app
      run: dotnet publish Toki.csproj -c Release --no-restore --self-contained false -o dist
    - name: Check launcher behavior
      run: dotnet run --project tests/Toki.LauncherChecks/Toki.LauncherChecks.csproj -c Release
